baseURL = "https://toad.mightyagents.dev/"
title = "Toad"
locale = "en"
theme = "mighty"
themesDir = "../../themes"
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true

[params]
  kind = "docs"
  logo = "logo-toad.html"
  tagline = "a testing agent your coding agent can call"
  description = "Toad tests the web apps and CLIs you build, in a real browser or a sandboxed container, and returns a verdict with receipts. Docs for installing, connecting and using it."
  groups = ["Getting started", "Using Toad", "Under the hood", "Reference"]
  [params.links]
    home = "https://mightyagents.dev/"
    forge = "https://forge.mightyagents.dev/"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[[menus.main]]
  name = "Install"
  url = "/install/"
  weight = 1
  [menus.main.params]
    class = "hide-sm"
[[menus.main]]
  name = "GitHub"
  url = "https://github.com/mihaiiova/toad"
  weight = 2
[[menus.main]]
  name = "Mighty Agents"
  url = "https://mightyagents.dev/"
  weight = 3
  [menus.main.params]
    class = "hide-sm"
