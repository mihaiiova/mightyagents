# The agents listed on mightyagents.dev, in order. Only list what is ready to share.
- id: toad
  name: Toad
  version: v0.7.0
  kind: MCP server and CLI
  logo: logo-toad.html
  term: term-toad.html
  summary: >-
    A testing agent for the web apps, command-line programs and HTTP APIs you build.
    Tell your coding agent what should work. Toad tests it in a real browser
    or a sandboxed container and hands back a verdict with receipts, not an opinion.
  points:
    - Web apps in headless Chromium, with screenshots of every step
    - CLIs and HTTP APIs in a sandbox, with commands and requests recorded
    - API response checks against your OpenAPI description
    - Saved suites that toad run reruns in CI on every deploy, with JUnit and a PR summary
    - Works with Claude Code, Codex, Pi, Cursor or any MCP client
    - Its testing agent is a plain Pi project generated with Faur
  install: npm install -g github:mihaiiova/toad && toad setup
  repo: https://github.com/mihaiiova/toad

- id: faur
  name: Faur
  version: v0.33.0
  kind: Pi package
  logo: logo-faur.html
  term: term-faur.html
  summary: >-
    The workshop the other agents come from. Describe the outcome you want;
    Faur designs the simplest agent that gets there, generates it as a plain
    Pi project, and keeps it working as your needs change.
  points:
    - Reads your repo and the pages you give it before asking design questions
    - A design conversation, not a form, and nothing is written until you confirm
    - Models, skills, MCP servers and CLI approvals chosen per agent
    - Generated projects run on plain Pi, never pin Faur, and a minimal agent pins nothing
    - Revisions and hand edits reviewed with a diff you approve; roll back with git
  install: pi install git:github.com/mihaiiova/faur@v0.33.0
  repo: https://github.com/mihaiiova/faur
